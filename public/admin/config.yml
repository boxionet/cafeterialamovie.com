# Decap CMS — Cafetería La Movie (cafeterialamovie.com)
# Login: https://cafeterialamovie.com/admin (invited users only, via DecapBridge)
#
# DecapBridge site: e9d365da-e6b0-4e5f-8f21-53fdb0281303 (configured 2026-11-23)
# GitHub repo: boxionet/cafeterialamovie.com, branch main.
# To invite an editor: DecapBridge dashboard → this site → Manage collaborators.
backend:
  name: git-gateway
  repo: boxionet/cafeterialamovie.com
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/e9d365da-e6b0-4e5f-8f21-53fdb0281303/pkce
  auth_token_endpoint: /sites/e9d365da-e6b0-4e5f-8f21-53fdb0281303/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: 'Create Menú via Decap CMS'
    update: 'Update Menú via Decap CMS'
    delete: 'Delete Menú via Decap CMS'
    uploadMedia: 'Upload "{{path}}" via Decap CMS'
    deleteMedia: 'Delete "{{path}}" via Decap CMS'
    openAuthoring: 'Message {{message}} via Decap CMS'

site_url: https://cafeterialamovie.com
logo_url: https://cafeterialamovie.com/assets/logo.svg

# Dish photos live here; any future image upload lands in the same folder.
media_folder: src/assets/images/dishes
public_folder: /assets/images/dishes

collections:
  - name: "menu"
    label: "Menú"
    file: "src/data/menu.json"
    description: "Platos, categorías y precios. Al guardar, el cambio se publica solo."
    fields:
      - name: "categories"
        label: "Categorías"
        widget: "list"
        fields:
          - label: "ID"
            name: "id"
            widget: "string"
            hint: "No cambiar — es el identificador interno de la categoría."
          - label: "Nombre"
            name: "label"
            widget: "string"
      - name: "dishes"
        label: "Platos"
        widget: "list"
        fields:
          - label: "ID"
            name: "id"
            widget: "string"
            hint: "No cambiar — es la dirección de la página del plato (/menu/…/)."
          - label: "Nombre"
            name: "name"
            widget: "string"
          - label: "Descripción"
            name: "desc"
            widget: "text"
            required: false
          - label: "Categoría"
            name: "category"
            widget: "select"
            options:
              - { label: "Hamburguesas y Hot Dogs", value: "hamburguesas" }
              - { label: "Mofongo", value: "mofongo" }
              - { label: "Pollo, Cerdo y Res a la Plancha", value: "plancha" }
              - { label: "Yaroa, Patacón, Chimi y Burritos", value: "yaroa" }
              - { label: "Sándwiches y Tostadas", value: "sandwiches" }
              - { label: "Papas, Fritos y Extras", value: "extras" }
          - label: "Foto"
            name: "photo"
            widget: "string"
            hint: "Nombre del archivo en src/assets/images/dishes/ (ej. 23-chimi-de-pierna.webp)."
          - label: "Foto plato negro"
            name: "platePhoto"
            widget: "string"
            required: false
            hint: "Nombre del archivo de la foto recreada en plato negro (ej. chimi-de-pierna-black-plate.jpg)."
          - name: "options"
            label: "Opciones y precios"
            widget: "list"
            fields:
              - label: "Opción"
                name: "label"
                widget: "string"
              - label: "Precio (RD$)"
                name: "price"
                widget: "number"
                value_type: "int"
                min: 0
